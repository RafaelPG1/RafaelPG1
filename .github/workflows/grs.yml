name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Download stats card
        run: |
          curl --fail -o profile/stats.svg "https://github-readme-stats-salesp07.vercel.app/api?username=RafaelPG1&show_icons=true&theme=tokyonight&locale=pt-br&include_all_commits=true&count_private=true" \
          || curl -o profile/stats.svg "https://github-readme-stats.vercel.app/api?username=RafaelPG1&show_icons=true&theme=tokyonight&locale=pt-br&include_all_commits=true"

      - name: Download langs card
        run: |
          curl --fail -o profile/langs.svg "https://github-readme-stats-salesp07.vercel.app/api/top-langs/?username=RafaelPG1&layout=compact&langs_count=7&theme=tokyonight&locale=pt-br" \
          || curl -o profile/langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=RafaelPG1&layout=compact&langs_count=7&theme=tokyonight&locale=pt-br"

      - name: Verify SVGs are valid
        run: |
          grep -q "<svg" profile/stats.svg || (echo "stats.svg invalido!" && exit 1)
          grep -q "<svg" profile/langs.svg || (echo "langs.svg invalido!" && exit 1)

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/
          git commit -m "Update README cards" || exit 0
          git push