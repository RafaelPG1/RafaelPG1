name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: RafaelPG1
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Fortaleza
          config_output: svg
          filename: profile/stats.svg

      - name: Generate langs
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: RafaelPG1
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 7
          config_timezone: America/Fortaleza
          config_output: svg
          filename: profile/langs.svg