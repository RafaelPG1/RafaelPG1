name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: RafaelPG1
          template: classic
          base: header, activity
          config_timezone: America/Fortaleza
          config_output: svg
          output_action: commit
          committer_branch: main
          filename: profile/stats.svg

      - name: Generate langs
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: RafaelPG1
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 7
          plugin_languages_sections: most-used
          config_timezone: America/Fortaleza
          config_output: svg
          output_action: commit
          committer_branch: main
          filename: profile/langs.svg